{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  labels:
    {{- include "order-system.labels" (dict "root" $ "name" "api-gateway") | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api               # only the API is public; /actuator stays internal
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
  {{- end }}
